<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      .tissue { fill: #e0e0e0; stroke: #999999; stroke-width: 2; stroke-linejoin: round; }
      .lesion { fill: #ff80ab; stroke: #f50057; stroke-width: 2; stroke-linejoin: round; }
      .title { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #333; text-anchor: middle; }
      .label { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #333; text-anchor: middle; }
      .sublabel { font-family: sans-serif; font-size: 13px; fill: #666; text-anchor: middle; }
    </style>
  </defs>

  <text x="500" y="36" class="title">Yamada classification of elevated gastric lesions</text>

  <g transform="translate(30, 60)">
    <path class="tissue" d="M0,118 H300 V180 H0 Z" />
    <path class="lesion" d="M18,118 C48,118 80,64 150,58 C220,64 252,118 282,118 Z" />
    <text x="150" y="208" class="label">Type I</text>
    <text x="150" y="228" class="sublabel">Gently sloping, indistinct</text>
  </g>

  <g transform="translate(350, 60)">
    <path class="tissue" d="M0,118 H86 L86,130 H214 L214,118 H300 V180 H0 Z" />
    <path class="lesion" d="M86,118 C86,48 214,48 214,118 L214,130 L86,130 Z" />
    <text x="150" y="208" class="label">Type II</text>
    <text x="150" y="228" class="sublabel">Distinct border, no notch</text>
  </g>

  <g transform="translate(670, 60)">
    <path class="tissue" d="M0,118 H118 L128,92 H172 L182,118 H300 V180 H0 Z" />
    <path class="lesion" d="M128,92 C96,22 204,22 172,92 L182,118 H118 Z" />
    <text x="150" y="208" class="label">Type III</text>
    <text x="150" y="228" class="sublabel">Constriction, no stalk</text>
  </g>

  <g transform="translate(190, 360)">
    <path class="tissue" d="M0,118 H136 L141,76 H159 L164,118 H300 V180 H0 Z" />
    <path class="lesion" d="M141,76 C96,8 204,8 159,76 L164,118 H136 Z" />
    <text x="150" y="208" class="label">Type IV</text>
    <text x="150" y="228" class="sublabel">Definite stalk</text>
  </g>
</svg>
