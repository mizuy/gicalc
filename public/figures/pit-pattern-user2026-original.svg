<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="100%" height="100%">
  <defs>
    <style>
      .table-line { stroke: #333; stroke-width: 1.5; }
      .type-text { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #333; text-anchor: middle; dominant-baseline: middle; }
      .desc-text { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #333; }
      .window-bg { fill: #e9ecef; stroke: #333; stroke-width: 2; stroke-linejoin: round; }
      .pit { fill: #ffffff; stroke: #333; stroke-width: 1.5; }
    </style>
    
    <!-- Type II: Circle with Asteroid shape inside -->
    <g id="asteroid">
      <circle cx="0" cy="0" r="11" class="pit" />
      <path fill="#444" d="M 0 -7 C 2 -2 3 -1 7 0 C 3 1 2 2 0 7 C -2 2 -3 1 -7 0 C -3 -1 -2 -2 0 -7 Z" />
    </g>
    
    <!-- Clip path for the chamfered square window -->
    <clipPath id="window-clip">
      <path d="M -42 -55 L 42 -55 L 55 -42 L 55 42 L 42 55 L -42 55 L -55 42 L -55 -42 Z" />
    </clipPath>
  </defs>

  <!-- Table Outlines -->
  <rect x="30" y="30" width="740" height="990" fill="none" class="table-line" />
  <line x1="150" y1="30" x2="150" y2="1020" class="table-line" />
  <line x1="330" y1="30" x2="330" y2="1020" class="table-line" />
  
  <line x1="30" y1="171" x2="770" y2="171" class="table-line" />
  <line x1="30" y1="312" x2="770" y2="312" class="table-line" />
  <line x1="30" y1="453" x2="770" y2="453" class="table-line" />
  <line x1="30" y1="594" x2="770" y2="594" class="table-line" />
  <line x1="30" y1="735" x2="770" y2="735" class="table-line" />
  <line x1="30" y1="876" x2="770" y2="876" class="table-line" />

  <!-- ================= TYPE I ================= -->
  <text x="90" y="100" class="type-text">I</text>
  <g transform="translate(240, 100)">
    <path d="M -42 -55 L 42 -55 L 55 -42 L 55 42 L 42 55 L -42 55 L -55 42 L -55 -42 Z" class="window-bg" />
    <g clip-path="url(#window-clip)">
      <!-- Jittered round pits -->
      <circle cx="-32" cy="-28" r="4.2" class="pit"/>
      <circle cx="-11" cy="-31" r="4.6" class="pit"/>
      <circle cx="12" cy="-29" r="4.1" class="pit"/>
      <circle cx="28" cy="-30" r="4.7" class="pit"/>
      <circle cx="-41" cy="-11" r="4.5" class="pit"/>
      <circle cx="-19" cy="-8"  r="4.2" class="pit"/>
      <circle cx="2"  cy="-12" r="4.8" class="pit"/>
      <circle cx="21" cy="-9"  r="4.0" class="pit"/>
      <circle cx="42" cy="-10" r="4.5" class="pit"/>
      <circle cx="-29" cy="11"  r="4.3" class="pit"/>
      <circle cx="-9"  cy="13"  r="4.6" class="pit"/>
      <circle cx="11" cy="8"   r="4.2" class="pit"/>
      <circle cx="31" cy="12"  r="4.5" class="pit"/>
      <circle cx="-42" cy="28"  r="4.4" class="pit"/>
      <circle cx="-21" cy="32"  r="4.1" class="pit"/>
      <circle cx="1"  cy="29"  r="4.7" class="pit"/>
      <circle cx="23" cy="31"  r="4.2" class="pit"/>
      <circle cx="41" cy="28"  r="4.5" class="pit"/>
    </g>
  </g>
  <text x="360" y="105" class="desc-text">Round pit (normal pit)</text>

  <!-- ================= TYPE II ================= -->
  <text x="90" y="241" class="type-text">II</text>
  <g transform="translate(240, 241)">
    <path d="M -42 -55 L 42 -55 L 55 -42 L 55 42 L 42 55 L -42 55 L -55 42 L -55 -42 Z" class="window-bg" />
    <g clip-path="url(#window-clip)">
      <!-- Densely packed Asteroid pits (almost touching) -->
      <use href="#asteroid" x="-34" y="-39" transform="rotate(15, -34, -39)" />
      <use href="#asteroid" x="-10" y="-37" transform="rotate(75, -10, -37)" />
      <use href="#asteroid" x="12" y="-38" transform="rotate(-20, 12, -38)" />
      <use href="#asteroid" x="32" y="-36" transform="rotate(45, 32, -36)" />
      
      <use href="#asteroid" x="-45" y="-18" transform="rotate(-40, -45, -18)" />
      <use href="#asteroid" x="-22" y="-19" transform="rotate(10, -22, -19)" />
      <use href="#asteroid" x="-1" y="-20" transform="rotate(80, -1, -20)" />
      <use href="#asteroid" x="21" y="-18" transform="rotate(-60, 21, -18)" />
      <use href="#asteroid" x="43" y="-19" transform="rotate(25, 43, -19)" />
      
      <use href="#asteroid" x="-32" y="-1" transform="rotate(55, -32, -1)" />
      <use href="#asteroid" x="-11" y="1" transform="rotate(-15, -11, 1)" />
      <use href="#asteroid" x="10" y="-2" transform="rotate(35, 10, -2)" />
      <use href="#asteroid" x="34" y="0" transform="rotate(-70, 34, 0)" />
      
      <use href="#asteroid" x="-43" y="18" transform="rotate(90, -43, 18)" />
      <use href="#asteroid" x="-21" y="20" transform="rotate(-5, -21, 20)" />
      <use href="#asteroid" x="2" y="19" transform="rotate(45, 2, 19)" />
      <use href="#asteroid" x="23" y="21" transform="rotate(-35, 23, 21)" />
      <use href="#asteroid" x="45" y="18" transform="rotate(60, 45, 18)" />
      
      <use href="#asteroid" x="-33" y="39" transform="rotate(-50, -33, 39)" />
      <use href="#asteroid" x="-10" y="38" transform="rotate(15, -10, 38)" />
      <use href="#asteroid" x="12" y="40" transform="rotate(-80, 12, 40)" />
      <use href="#asteroid" x="33" y="37" transform="rotate(25, 33, 37)" />
    </g>
  </g>
  <text x="360" y="246" class="desc-text">Asteroid pit</text>

  <!-- ================= TYPE IIIs ================= -->
  <text x="90" y="382" class="type-text">IIIs</text>
  <g transform="translate(240, 382)">
    <path d="M -42 -55 L 42 -55 L 55 -42 L 55 42 L 42 55 L -42 55 L -55 42 L -55 -42 Z" class="window-bg" />
    <g clip-path="url(#window-clip)">
      <circle cx="-35" cy="-25" r="2.5" class="pit"/><circle cx="-25" cy="-35" r="2.5" class="pit"/><circle cx="-15" cy="-25" r="2.5" class="pit"/><circle cx="-5" cy="-40" r="2.5" class="pit"/><circle cx="5" cy="-25" r="2.5" class="pit"/><circle cx="15" cy="-35" r="2.5" class="pit"/><circle cx="25" cy="-20" r="2.5" class="pit"/><circle cx="35" cy="-30" r="2.5" class="pit"/>
      <circle cx="-42" cy="-10" r="2.5" class="pit"/><circle cx="-30" cy="-5" r="2.5" class="pit"/><circle cx="-20" cy="-15" r="2.5" class="pit"/><circle cx="-10" cy="-5" r="2.5" class="pit"/><circle cx="0" cy="-15" r="2.5" class="pit"/><circle cx="10" cy="-5" r="2.5" class="pit"/><circle cx="20" cy="-10" r="2.5" class="pit"/><circle cx="30" cy="-5" r="2.5" class="pit"/><circle cx="40" cy="-15" r="2.5" class="pit"/>
      <circle cx="-35" cy="15" r="2.5" class="pit"/><circle cx="-25" cy="5" r="2.5" class="pit"/><circle cx="-15" cy="15" r="2.5" class="pit"/><circle cx="-5" cy="5" r="2.5" class="pit"/><circle cx="5" cy="15" r="2.5" class="pit"/><circle cx="15" cy="5" r="2.5" class="pit"/><circle cx="25" cy="15" r="2.5" class="pit"/><circle cx="35" cy="5" r="2.5" class="pit"/><circle cx="45" cy="15" r="2.5" class="pit"/>
      <circle cx="-30" cy="30" r="2.5" class="pit"/><circle cx="-20" cy="25" r="2.5" class="pit"/><circle cx="-10" cy="35" r="2.5" class="pit"/><circle cx="0" cy="25" r="2.5" class="pit"/><circle cx="10" cy="35" r="2.5" class="pit"/><circle cx="20" cy="25" r="2.5" class="pit"/><circle cx="30" cy="35" r="2.5" class="pit"/><circle cx="-25" cy="40" r="2.5" class="pit"/><circle cx="-5" cy="45" r="2.5" class="pit"/><circle cx="15" cy="45" r="2.5" class="pit"/>
    </g>
  </g>
  <text x="360" y="365" class="desc-text">Tubular or round pit that</text>
  <text x="360" y="388" class="desc-text">is smaller than the normal pit</text>
  <text x="360" y="411" class="desc-text">(Type I)</text>

  <!-- ================= TYPE IIIL ================= -->
  <text x="90" y="523" class="type-text">IIIL</text>
  <g transform="translate(240, 523)">
    <path d="M -42 -55 L 42 -55 L 55 -42 L 55 42 L 42 55 L -42 55 L -55 42 L -55 -42 Z" class="window-bg" />
    <g clip-path="url(#window-clip)">
      <g transform="translate(0, -32) rotate(10)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" class="pit"/></g>
      <g transform="translate(-28, -18) rotate(45)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" class="pit"/></g>
      <g transform="translate(25, -20) rotate(-20)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" class="pit"/></g>
      <g transform="translate(-32, 10) rotate(-15)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" class="pit"/></g>
      <g transform="translate(-5, -5) rotate(75)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" class="pit"/></g>
      <g transform="translate(28, 5) rotate(35)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" class="pit"/></g>
      <g transform="translate(-18, 28) rotate(60)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" class="pit"/></g>
      <g transform="translate(10, 22) rotate(-10)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" class="pit"/></g>
      <g transform="translate(30, 30) rotate(-60)"><rect x="-12" y="-4.5" width="24" height="9" rx="4.5" class="pit"/></g>
      <g transform="translate(-5, 42) rotate(5)"><rect x="-10" y="-4" width="20" height="8" rx="4" class="pit"/></g>
    </g>
  </g>
  <text x="360" y="506" class="desc-text">Tubular or round pit that</text>
  <text x="360" y="529" class="desc-text">is larger than the normal</text>
  <text x="360" y="552" class="desc-text">pit (Type I)</text>

  <!-- ================= TYPE IV ================= -->
  <text x="90" y="664" class="type-text">IV</text>
  <g transform="translate(240, 664)">
    <path d="M -42 -55 L 42 -55 L 55 -42 L 55 42 L 42 55 L -42 55 L -55 42 L -55 -42 Z" class="window-bg" />
    <g clip-path="url(#window-clip)">
      <!-- Background Stroke (Black Outline) -->
      <g stroke="#333" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Pit Center -->
        <path d="M 0 15 L 0 0 L -10 -12" /> <path d="M 0 0 L 10 -12" />
        <!-- Pit Top-Left -->
        <path d="M -35 -40 L -25 -25 L -35 -15" /> <path d="M -25 -25 L -10 -25" />
        <!-- Pit Top-Right -->
        <path d="M 35 -40 L 25 -25 L 10 -25" /> <path d="M 25 -25 L 35 -15" />
        <!-- Pit Left-Middle -->
        <path d="M -45 5 L -30 5 L -20 15" /> <path d="M -30 5 L -20 -5" />
        <!-- Pit Right-Middle -->
        <path d="M 45 5 L 30 5 L 20 -5" /> <path d="M 30 5 L 20 15" />
        <!-- Pit Bottom-Left -->
        <path d="M -30 45 L -20 30 L -5 35" /> <path d="M -20 30 L -30 18" />
        <!-- Pit Bottom-Right -->
        <path d="M 30 45 L 20 30 L 5 35" /> <path d="M 20 30 L 30 18" />
      </g>
      
      <!-- Foreground Stroke (White Inner) -->
      <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 0 15 L 0 0 L -10 -12" /> <path d="M 0 0 L 10 -12" />
        <path d="M -35 -40 L -25 -25 L -35 -15" /> <path d="M -25 -25 L -10 -25" />
        <path d="M 35 -40 L 25 -25 L 10 -25" /> <path d="M 25 -25 L 35 -15" />
        <path d="M -45 5 L -30 5 L -20 15" /> <path d="M -30 5 L -20 -5" />
        <path d="M 45 5 L 30 5 L 20 -5" /> <path d="M 30 5 L 20 15" />
        <path d="M -30 45 L -20 30 L -5 35" /> <path d="M -20 30 L -30 18" />
        <path d="M 30 45 L 20 30 L 5 35" /> <path d="M 20 30 L 30 18" />
      </g>
    </g>
  </g>
  <text x="360" y="652" class="desc-text">Dendritic or gyrus-</text>
  <text x="360" y="676" class="desc-text">like pit</text>

  <!-- ================= TYPE VI ================= -->
  <text x="90" y="805" class="type-text">VI</text>
  <g transform="translate(240, 805)">
    <path d="M -42 -55 L 42 -55 L 55 -42 L 55 42 L 42 55 L -42 55 L -55 42 L -55 -42 Z" class="window-bg" />
    <g clip-path="url(#window-clip)">
      <!-- Dendritic IV-like components (Rotated randomly) -->
      <g stroke="#333" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M -35 -20 L -20 -20 L -10 -10" /> <path d="M -20 -20 L -15 -35" />
        <path d="M 35 25 L 20 25 L 10 15" /> <path d="M 20 25 L 25 40" />
      </g>
      <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M -35 -20 L -20 -20 L -10 -10" /> <path d="M -20 -20 L -15 -35" />
        <path d="M 35 25 L 20 25 L 10 15" /> <path d="M 20 25 L 25 40" />
      </g>
      
      <!-- IIIL-like components (Rotated and scattered) -->
      <g transform="translate(25, -25) rotate(45)"><rect x="-10" y="-3.5" width="20" height="7" rx="3.5" class="pit"/></g>
      <g transform="translate(-25, 30) rotate(-30)"><rect x="-10" y="-3.5" width="20" height="7" rx="3.5" class="pit"/></g>
      <g transform="translate(0, 0) rotate(15)"><rect x="-8" y="-3.5" width="16" height="7" rx="3.5" class="pit"/></g>
      <g transform="translate(-35, 5) rotate(80)"><rect x="-8" y="-3.5" width="16" height="7" rx="3.5" class="pit"/></g>
      <g transform="translate(35, 0) rotate(-10)"><rect x="-8" y="-3.5" width="16" height="7" rx="3.5" class="pit"/></g>
      <g transform="translate(0, -35) rotate(-15)"><rect x="-8" y="-3.5" width="16" height="7" rx="3.5" class="pit"/></g>
      <g transform="translate(0, 35) rotate(-75)"><rect x="-8" y="-3.5" width="16" height="7" rx="3.5" class="pit"/></g>
      
      <!-- IIIs-like components (precise dots filling remaining safe voids) -->
      <circle cx="-18" cy="-5" r="2.2" class="pit"/>
      <circle cx="-15" cy="12" r="2.2" class="pit"/>
      <circle cx="15" cy="-12" r="2.2" class="pit"/>
      <circle cx="18" cy="10" r="2.2" class="pit"/>
      <circle cx="-40" cy="-40" r="2.2" class="pit"/>
      <circle cx="40" cy="-40" r="2.2" class="pit"/>
      <circle cx="-40" cy="40" r="2.2" class="pit"/>
      <circle cx="40" cy="40" r="2.2" class="pit"/>
      <circle cx="15" cy="-28" r="2.2" class="pit"/>
      <circle cx="-15" cy="28" r="2.2" class="pit"/>
      <circle cx="22" cy="-40" r="2.2" class="pit"/>
      <circle cx="-22" cy="40" r="2.2" class="pit"/>
      <circle cx="42" cy="20" r="2.2" class="pit"/>
      <circle cx="-42" cy="-20" r="2.2" class="pit"/>
    </g>
  </g>
  <text x="360" y="793" class="desc-text">Irregular arrangement and</text>
  <text x="360" y="816" class="desc-text">sizes of IIIL, IIIs, IV type pit</text>
  <text x="360" y="839" class="desc-text">pattern</text>

  <!-- ================= TYPE VN ================= -->
  <text x="90" y="946" class="type-text">VN</text>
  <g transform="translate(240, 946)">
    <path d="M -42 -55 L 42 -55 L 55 -42 L 55 42 L 42 55 L -42 55 L -55 42 L -55 -42 Z" class="window-bg" />
    <g clip-path="url(#window-clip)">
      <!-- Amorphous / loss of pits -->
      <path d="M-15,-25 Q-10,-28 -5,-25" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="-25" cy="-10" r="1.5" fill="#333" />
      <path d="M15,-15 L20,-17 L22,-12 Z" fill="#333" />
      <path d="M-5,10 Q-2,15 3,10" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="25" cy="5" r="1" fill="#333" />
      <circle cx="-20" cy="25" r="1.5" fill="#333" />
      <path d="M10,25 L15,35 L20,30 Z" fill="#ffffff" stroke="#333" stroke-width="1.5" />
      <path d="M-10,40 L-5,42" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="35" cy="20" r="2" fill="#333" />
    </g>
  </g>
  <text x="360" y="934" class="desc-text">Loss or decrease of pits with</text>
  <text x="360" y="958" class="desc-text">an amorphous structure</text>

</svg>
