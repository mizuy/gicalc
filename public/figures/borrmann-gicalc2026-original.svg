<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      .wall { fill: #e8e8e8; stroke: #9e9e9e; stroke-width: 1.8; stroke-linejoin: round; }
      .lumen { fill: #fafafa; }
      .tumor { fill: #ff80ab; stroke: #f50057; stroke-width: 1.8; stroke-linejoin: round; }
      .title { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #333; text-anchor: middle; }
      .label { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #333; text-anchor: middle; }
      .sublabel { font-family: sans-serif; font-size: 13px; fill: #666; text-anchor: middle; }
    </style>
  </defs>

  <text x="500" y="36" class="title">Borrmann types of advanced gastric cancer</text>

  <g transform="translate(30, 60)">
    <rect class="lumen" x="0" y="20" width="300" height="98" />
    <path class="wall" d="M0,118 H82 L82,128 H218 L218,118 H300 V180 H0 Z" />
    <path class="tumor" d="M82,118 C82,42 218,42 218,118 L218,128 L82,128 Z" />
    <text x="150" y="208" class="label">Type 1</text>
    <text x="150" y="228" class="sublabel">Polypoid / fungating</text>
  </g>

  <g transform="translate(350, 60)">
    <rect class="lumen" x="0" y="20" width="300" height="98" />
    <path class="wall" d="M0,118 H300 V180 H0 Z" />
    <path class="tumor" d="M58,118 L76,50 H114 L126,98 H174 L186,50 H224 L242,118 Z" />
    <text x="150" y="208" class="label">Type 2</text>
    <text x="150" y="228" class="sublabel">Ulcer, sharp margins</text>
  </g>

  <g transform="translate(670, 60)">
    <rect class="lumen" x="0" y="20" width="300" height="98" />
    <path class="wall" d="M0,118 H300 V180 H0 Z" />
    <path class="tumor" d="M34,168 L66,50 H110 L124,110 H180 L194,62 H242 L274,168 Z" />
    <text x="150" y="208" class="label">Type 3</text>
    <text x="150" y="228" class="sublabel">Infiltrative ulcer</text>
  </g>

  <g transform="translate(190, 360)">
    <rect class="lumen" x="0" y="20" width="300" height="78" />
    <path class="wall" d="M0,98 H300 V180 H0 Z" />
    <path class="tumor" d="M0,110 C40,96 80,114 140,102 C190,92 240,112 300,106 V170 H0 Z" />
    <text x="150" y="208" class="label">Type 4</text>
    <text x="150" y="228" class="sublabel">Diffuse / linitis plastica</text>
  </g>
</svg>
